# Acessa o sistema a cada 10 minutos para o Render não colocar o serviço para dormir.
name: Manter o sistema acordado

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  acessar:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar a página inicial
        run: |
          curl -s -o /dev/null -w "Resposta: %{http_code}\n" --max-time 120 https://aruamar.onrender.com/
